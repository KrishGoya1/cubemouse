<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width,initial-scale=1"><title>CubeMouse WS Test</title>
<style>body{margin:0;background:#111;color:#fff;font-family:sans-serif}#pad{width:100vw;height:100vh;background:#222;touch-action:none}</style>
</head>
<body>
<div id="pad"></div>
<script>
const ws = new WebSocket("ws://" + "10.180.49.138" + ":9000");
ws.binaryType = "arraybuffer";

let lastX = null, lastY = null;
const pad = document.getElementById("pad");

pad.addEventListener("touchstart", e => {
  const t = e.touches[0];
  lastX = t.clientX; lastY = t.clientY;
  e.preventDefault();
}, {passive:false});

pad.addEventListener("touchmove", e => {
  const t = e.touches[0];
  if (lastX !== null) {
    const dx = Math.round(t.clientX - lastX);
    const dy = Math.round(t.clientY - lastY);
    const buf = new ArrayBuffer(5);
    const dv = new DataView(buf);
    dv.setUint8(0, 0x01);
    dv.setInt16(1, dx, true);
    dv.setInt16(3, dy, true);
    if (ws.readyState === WebSocket.OPEN) ws.send(buf);
  }
  lastX = t.clientX; lastY = t.clientY;
  e.preventDefault();
}, {passive:false});

pad.addEventListener("touchend", () => { lastX = lastY = null; });
</script>
</body>
</html>
